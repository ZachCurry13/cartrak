# CarTrak for TrueNAS SCALE: Apps -> Discover Apps -> Custom App -> "Install via YAML".
# Full guide: docs/truenas.md. Replace every value marked CHANGE-ME. Never commit real values.
#
# Two folders are mapped from your pool:
#   /data   the database and cached Ford data (back this up)
#   /config settings: put a config.yaml here (see config.example.yaml, which CarTrak writes there on first start)
# Settings can also be given as environment variables below; environment variables win over config.yaml.
services:
  cartrak:
    image: ghcr.io/zachcurry13/cartrak:latest
    pull_policy: always              # Stop then Start in TrueNAS pulls the newest release
    restart: unless-stopped
    environment:
      CARTRAK_PROVIDER: fordconnect          # "demo" tries the app with a simulated car
      CARTRAK_TZ: UTC                        # CHANGE-ME: your IANA time zone, so work-hour rules use local time
      # Ford credentials: either here, or (recommended) in /config/config.yaml
      # FORD_CLIENT_ID: CHANGE-ME
      # FORD_CLIENT_SECRET: CHANGE-ME
      # FORD_APPLICATION_ID: CHANGE-ME
      # FORD_REDIRECT_URL: https://CHANGE-ME.example.com/ford/callback
    volumes:
      - /mnt/POOL/apps/cartrak/data:/data        # CHANGE-ME
      - /mnt/POOL/apps/cartrak/config:/config    # CHANGE-ME
    # ports:                                 # optional: direct LAN access (the tunnel does not need it)
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: CHANGE-ME                # from Cloudflare Zero Trust -> Networks -> Tunnels
    depends_on:
      - cartrak
