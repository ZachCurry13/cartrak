# Free security checks for a public repository. They run on GitHub's own runners and use no paid services.
#  - govulncheck: Go's official vulnerability scanner, checks the Go version and the libraries against the Go vulnerability database.
#  - CodeQL: GitHub's code scanner for Go and JavaScript. Findings appear under the repository's Security tab.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays: new vulnerabilities are found in old code too

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@v4
