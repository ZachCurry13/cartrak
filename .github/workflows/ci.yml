name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax
        run: |
          for f in internal/web/static/js/*.js internal/web/static/js/pages/*.js internal/web/static/sw.js; do
            node --input-type=module --check < "$f" || { echo "BAD $f"; exit 1; }
          done
