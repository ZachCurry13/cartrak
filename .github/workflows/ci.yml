name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JS syntax
        run: |
          for f in internal/web/static/js/*.js internal/web/static/js/pages/*.js internal/web/static/sw.js; do
            node --input-type=module --check < "$f" || { echo "BAD $f"; exit 1; }
          done

  docker:
    # Builds the real image on every push and starts it, so a packaging mistake
    # (for example the bundled Cloudflare connector) shows up here and not at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cartrak:ci
      - name: Smoke test
        run: |
          docker run --rm --entrypoint cloudflared cartrak:ci --version
          docker run -d --name ct -e CARTRAK_PROVIDER=demo -p 8080:8080 cartrak:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          curl -fsS http://localhost:8080/healthz
          docker logs ct
          docker rm -f ct
