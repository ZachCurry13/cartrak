name: docker

# Push to main  -> publishes :main
# Manual run with a version (the release flow) -> publishes :X.Y.Z and :latest and a GitHub Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (leave empty to only build :main)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Tags
        id: tags
        run: |
          TAGS="${IMAGE}:main"
          V="${{ github.event.inputs.version }}"
          if [ -n "$V" ]; then TAGS="${IMAGE}:${V},${IMAGE}:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ github.event.inputs.version || 'main' }}
      - name: GitHub Release
        if: ${{ github.event.inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ github.event.inputs.version }}"
          awk -v v="$V" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $V" > notes.md
          gh release create "v$V" --target "${GITHUB_SHA}" --title "v$V" --notes-file notes.md
